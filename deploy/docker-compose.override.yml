# Place next to docker-compose.yml in the community-edition checkout.
# Compose merges this automatically, so the upstream docker-compose.yml and
# reverse-proxy/docker-compose.caddy-gen.yml stay unmodified and `git pull`
# in that repo never conflicts.
services:
  wanderer:
    image: wanderer-custom:latest
    pull_policy: never
    # Caddy reaches wanderer over the shared `web` network, so the direct
    # host-port publish is unnecessary and would bypass the proxy. `!override`
    # (requires Docker Compose v2.24+) replaces the base file's ports instead
    # of merging with them. Delete these two lines if you ever run without a
    # reverse proxy and need http://server:8000 back.
    ports: !override []

  eve-route-builder:
    image: eve-route-builder-custom:latest
    pull_policy: never

  # Proxy to the wanderer container over the `web` network instead of going
  # out to the public IP and back through the (now removed) host port. This
  # also carries the domain, so the upstream caddy-gen file needs no edits.
  caddy-gen:
    command: caddy reverse-proxy --from https://maps.astralaide.com --to http://wanderer:8000
