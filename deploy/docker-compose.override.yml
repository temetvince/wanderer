# Place next to docker-compose.yml in the community-edition checkout.
# Compose merges this automatically, so the upstream docker-compose.yml stays
# unmodified and `git pull` in that repo never conflicts.
services:
  wanderer:
    image: wanderer-custom:latest
    pull_policy: never
    # Caddy reaches wanderer over the shared `web` network, so the direct
    # host-port publish is unnecessary and would bypass the proxy. `!override`
    # (requires Docker Compose v2.24+) replaces the base file's ports instead
    # of merging with them. Delete these two lines if you ever run without a
    # reverse proxy and need http://server:8000 back.
    ports: !override []

  eve-route-builder:
    image: eve-route-builder-custom:latest
    pull_policy: never
